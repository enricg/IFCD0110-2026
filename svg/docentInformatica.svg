<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="board-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fons de l'aula tecno/informàtica -->
  <rect width="800" height="600" fill="url(#bg-grad)"/>
  <rect y="500" width="800" height="100" fill="#0b0f19"/>
  <line x1="0" y1="500" x2="800" y2="500" stroke="#334155" stroke-width="2"/>

  <!-- Pissarra digital / Pantalla de codi -->
  <rect x="60" y="40" width="500" height="320" rx="10" fill="url(#board-grad)" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
  <!-- Barra superior de la finestra de IDE -->
  <rect x="60" y="40" width="500" height="30" rx="10" fill="#1f2937"/>
  <circle cx="85" cy="55" r="5" fill="#ef4444"/>
  <circle cx="100" cy="55" r="5" fill="#f59e0b"/>
  <circle cx="115" cy="55" r="5" fill="#10b981"/>
  <text x="310" y="60" fill="#9ca3af" font-family="monospace" font-size="12" text-anchor="middle">class_lesson.py - Visual Studio Code</text>

  <!-- Codi a la pantalla -->
  <g font-family="'Fira Code', 'Courier New', monospace" font-size="15" opacity="0.95">
    <text x="85" y="105" fill="#f43f5e">def <tspan fill="#60a5fa">main</tspan>():</text>
    <text x="110" y="130" fill="#94a3b8"># Aprenent algoritmes i estructures</text>
    <text x="110" y="155" fill="#f43f5e">students <tspan fill="#f59e0b">=</tspan> <tspan fill="#38bdf8">["Anna", "Marc", "Pol"]</tspan></text>
    <text x="110" y="180" fill="#f43f5e">for <tspan fill="#e879f9">student</tspan> in <tspan fill="#f59e0b">students</tspan>:</text>
    <text x="135" y="205" fill="#34d399">print<tspan fill="#f59e0b">(f"Hola <tspan fill="#e879f9">{student}</tspan>!")</tspan></text>
    
    <!-- Esquema / Diagrama de flux lateral -->
    <rect x="360" y="95" width="170" height="150" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="445" y="120" fill="#38bdf8" font-size="12" text-anchor="middle" font-weight="bold">ARQUITECTURA CPU</text>
    
    <rect x="380" y="135" width="60" height="30" rx="4" fill="#3b82f6"/>
    <text x="410" y="155" fill="#ffffff" font-size="11" text-anchor="middle">ALU</text>

    <rect x="455" y="135" width="60" height="30" rx="4" fill="#10b981"/>
    <text x="485" y="155" fill="#ffffff" font-size="11" text-anchor="middle">RAM</text>

    <rect x="410" y="185" width="80" height="30" rx="4" fill="#8b5cf6"/>
    <text x="450" y="205" fill="#ffffff" font-size="11" text-anchor="middle">Control</text>

    <!-- Matriu de Binari -->
    <text x="85" y="260" fill="#34d399" font-size="13" opacity="0.7">01000011 01001111 01000100 01001001</text>
    <text x="85" y="285" fill="#38bdf8" font-size="14">&gt; python3 teacher_script.py</text>
    <text x="85" y="310" fill="#facc15" font-size="14">[SUCCESS] Execució completada ✓</text>
  </g>

  <!-- Taula de treball -->
  <g id="desk">
    <rect x="40" y="440" width="380" height="16" fill="#334155" rx="3"/>
    <rect x="60" y="456" width="20" height="90" fill="#1e293b"/>
    <rect x="380" y="456" width="20" height="90" fill="#1e293b"/>

    <!-- Portàtil obert -->
    <path d="M 120 440 L 140 380 L 240 380 L 260 440 Z" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <polygon points="143,383 237,383 255,437 125,437" fill="#1e293b"/>
    <line x1="148" y1="395" x2="200" y2="395" stroke="#38bdf8" stroke-width="2"/>
    <line x1="148" y1="405" x2="220" y2="405" stroke="#34d399" stroke-width="2"/>
    <line x1="148" y1="415" x2="180" y2="415" stroke="#f43f5e" stroke-width="2"/>
    <rect x="110" y="440" width="160" height="8" rx="2" fill="#64748b"/>

    <!-- Tassa de cafè de programador -->
    <rect x="290" y="415" width="22" height="25" rx="3" fill="#f8fafc"/>
    <path d="M 312 420 C 320 420, 320 432, 312 432" stroke="#f8fafc" stroke-width="3" fill="none"/>
    <text x="301" y="432" fill="#0f172a" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>

    <!-- Encaminador / Router WiFi -->
    <rect x="330" y="425" width="45" height="15" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <line x1="340" y1="425" x2="340" y2="410" stroke="#94a3b8" stroke-width="2"/>
    <line x1="365" y1="425" x2="365" y2="410" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="340" cy="432" r="1.5" fill="#34d399"/>
    <circle cx="348" cy="432" r="1.5" fill="#34d399"/>
    <circle cx="356" cy="432" r="1.5" fill="#38bdf8"/>
  </g>

  <!-- Server Rack al fons -->
  <rect x="700" y="220" width="70" height="280" rx="5" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <g fill="#1e293b" stroke="#475569" stroke-width="1">
    <rect x="708" y="235" width="54" height="30" rx="3"/>
    <circle cx="720" cy="250" r="3" fill="#34d399"/>
    <circle cx="730" cy="250" r="3" fill="#38bdf8"/>

    <rect x="708" y="275" width="54" height="30" rx="3"/>
    <circle cx="720" cy="290" r="3" fill="#34d399"/>
    <circle cx="730" cy="290" r="3" fill="#f59e0b"/>

    <rect x="708" y="315" width="54" height="30" rx="3"/>
    <circle cx="720" cy="330" r="3" fill="#34d399"/>

    <rect x="708" y="355" width="54" height="30" rx="3"/>
    <circle cx="720" cy="370" r="3" fill="#ef4444"/>
  </g>

  <!-- Professor d'Informàtica -->
  <g id="teacher">
    <ellipse cx="580" cy="505" rx="60" ry="10" fill="#090d16"/>

    <!-- Cames -->
    <rect x="550" y="380" width="24" height="120" rx="8" fill="#1e293b"/>
    <rect x="586" y="380" width="24" height="120" rx="8" fill="#1e293b"/>
    <!-- Sabates -->
    <path d="M 540 495 C 540 485, 578 485, 578 505 L 540 505 Z" fill="#f8fafc"/>
    <path d="M 582 495 C 582 485, 620 485, 620 505 L 582 505 Z" fill="#f8fafc"/>

    <!-- Sudadera amb logotip de desenvolupador -->
    <path d="M 530 240 C 530 210, 630 210, 630 240 L 620 385 L 540 385 Z" fill="#0284c7"/>
    <text x="580" y="310" fill="#ffffff" font-family="monospace" font-size="22" font-weight="bold" text-anchor="middle" opacity="0.9">&lt;/&gt;</text>

    <!-- Acreditació / Lanyard -->
    <path d="M 560 230 L 575 320 L 585 320 L 600 230" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <rect x="568" y="320" width="24" height="32" rx="2" fill="#ffffff"/>

    <!-- Braç esquerre amb llapis digital -->
    <path d="M 535 240 L 460 210 L 450 220 L 525 260 Z" fill="#0369a1"/>
    <circle cx="452" cy="215" r="10" fill="#fbcfe8"/>
    <line x1="460" y1="220" x2="400" y2="180" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>

    <!-- Braç dret amb tauleta -->
    <path d="M 625 240 L 645 300 L 620 320 L 605 260 Z" fill="#0369a1"/>
    <circle cx="635" cy="310" r="10" fill="#fbcfe8"/>
    <rect x="620" y="295" width="35" height="45" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" transform="rotate(-15 620 295)"/>

    <!-- Coll i Cap -->
    <rect x="568" y="205" width="24" height="25" rx="6" fill="#fbcfe8"/>
    <ellipse cx="580" cy="170" rx="42" ry="46" fill="#fbcfe8"/>

    <!-- Cabell i Barba -->
    <path d="M 538 165 C 538 110, 622 110, 622 165 C 612 120, 548 120, 538 165 Z" fill="#331f19"/>
    <path d="M 542 170 C 542 215, 618 215, 618 170 C 618 200, 542 200, 542 170 Z" fill="#331f19"/>

    <!-- Ulleres i Rostre -->
    <rect x="548" y="153" width="26" height="20" rx="4" fill="none" stroke="#f8fafc" stroke-width="3"/>
    <rect x="586" y="153" width="26" height="20" rx="4" fill="none" stroke="#f8fafc" stroke-width="3"/>
    <line x1="574" y1="163" x2="586" y2="163" stroke="#f8fafc" stroke-width="3"/>

    <circle cx="561" cy="163" r="4" fill="#0f172a"/>
    <circle cx="599" cy="163" r="4" fill="#0f172a"/>
    <path d="M 568 188 Q 580 198 592 188" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
