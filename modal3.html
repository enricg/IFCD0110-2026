  </head>
  <body>
    <div class="modal" id="modal1">
      <div class="modal-inner">
        <h2>Modal 1: Zoom In</h2>
        <p>Animación de zoom y fondo translúcido.</p>
        <button class="close-modal" data-close="modal1">Cerrar</button>
      </div>
    </div>

    <button id="open-modal1">Zoom</button>
    <script>
      var open = document.getElementById("open-modal1");
      var modal1 = document.getElementById("modal1");
      var close = modal1.querySelector("[data-close=modal1]");
      open.addEventListener("click", () => modal1.classList.add("active"));
      close.addEventListener("click", () => modal1.classList.remove("active"));
    </script>
  </body>
