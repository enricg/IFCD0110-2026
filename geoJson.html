<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" href="./imgs/favicon.svg" type="image/x-icon" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script
      src="https://code.jquery.com/jquery-4.0.0.js"
      integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./css/geoJson.css" />
    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <!-- CSS del plugin de clustering (a més del CSS de Leaflet que ja tens) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
    />

    <!-- JS del plugin: ha d'anar DESPRÉS de leaflet.js i ABANS del teu script.js -->
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="./js/geoJson.js" defer></script>
  </head>

  <body>
    <nav class="navbar navbar-dark bg-primary fixed-top">
      <div class="container-fluid">
        <button
          class="navbar-toggler d-lg-none"
          data-bs-toggle="offcanvas"
          data-bs-target="#menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <a class="navbar-brand" href="#"> La meva web </a>
      </div>
    </nav>

    <!-- Menú lateral PC -->

    <div class="sidebar d-none d-lg-block">
      <div class="list-group list-group-flush" id="container"></div>
    </div>

    <!-- Menú mòbil -->

    <div class="offcanvas offcanvas-start" tabindex="-1" id="menu">
      <div class="offcanvas-header">
        <h5>Menú</h5>

        <button class="btn-close" data-bs-dismiss="offcanvas"></button>
      </div>

      <div class="offcanvas-body">
        <div class="list-group" id="responsive"></div>
      </div>
    </div>

    <main id="principal"></main>

    <footer class="bg-dark text-white text-center p-4">Peu de pàgina</footer>
  </body>
</html>
